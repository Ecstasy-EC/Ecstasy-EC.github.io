#                       Omit it and the entry renders as text only.
#   image    (optional) a still shown beside the entry instead, e.g. Figure 1 of
#                       the paper. Path is relative to images/, so
#                       'figures/dogflow.jpg' -> images/figures/dogflow.jpg
#                       Letterboxed into the same 16:9 frame as the videos.
#                       `video` wins if both are set.
#   media_side (optional) left | right    -> defaults to right
#
# NOTE: single-quoted YAML keeps backslashes literal, which the MathJax
# markers need. Do not switch these to double quotes.

